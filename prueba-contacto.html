<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Prueba contacto UGT</title>
<style>
body{font-family:Arial,sans-serif;max-width:680px;margin:40px auto;padding:0 20px;line-height:1.5}
label{display:block;font-weight:700;margin-top:16px}
input,textarea,button{width:100%;box-sizing:border-box;padding:12px;font-size:16px;margin-top:6px}
textarea{min-height:140px}button{font-weight:700;cursor:pointer;margin-top:20px}
#resultado{margin-top:20px;padding:14px;background:#f3f3f3;border-radius:8px;display:none}
</style>
</head>
<body>
<h1>Prueba formulario de contacto</h1>
<p>Prueba temporal desde la web real UGT ECI.</p>
<form id="form">
<label>Centro</label><input name="centro" value="San Juan" required>
<label>Nombre</label><input name="nombre" value="Prueba web UGT">
<label>Contacto</label><input name="contacto" value="Prueba SMTP" required>
<label>Mensaje</label><textarea name="mensaje" required>Mensaje de prueba del nuevo formulario SMTP.</textarea>
<input name="web" style="display:none" tabindex="-1" autocomplete="off">
<button type="submit">ENVIAR PRUEBA</button>
</form>
<div id="resultado"></div>
<script>
const form=document.getElementById('form'), resultado=document.getElementById('resultado');
form.addEventListener('submit',async e=>{
 e.preventDefault(); resultado.style.display='block'; resultado.textContent='Enviando...';
 try{
  const r=await fetch('https://ugteci.es/prueba-contacto-smtp.php',{method:'POST',body:new FormData(form)});
  const d=await r.json();
  resultado.textContent=d.mensaje || (d.ok?'Enviado correctamente.':'Ha ocurrido un error.');
 }catch(e){resultado.textContent='No se pudo completar la prueba.';}
});
</script>
</body>
</html>
