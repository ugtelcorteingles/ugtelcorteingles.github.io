<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UGT El Corte Inglés</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f4f4f4;
  color: #222;
}

header {
  background: #e30613;
  color: white;
  padding: 45px 20px;
  text-align: center;
}

.ugt {
  font-size: 48px;
  font-weight: 900;
  margin: 0;
}

header h1 {
  font-size: 27px;
  margin: 5px 0;
}

header p {
  margin: 12px 0 0;
  font-size: 16px;
}

main {
  max-width: 650px;
  margin: auto;
  padding: 35px 20px;
}

.intro {
  text-align: center;
  margin-bottom: 30px;
}

.intro h2 {
  font-size: 25px;
  margin-bottom: 8px;
}

.intro p {
  color: #666;
}

.provincia {
  display: block;
  background: white;
  padding: 20px;
  margin-bottom: 14px;
  border-radius: 12px;
  text-decoration: none;
  color: #222;
  font-size: 19px;
  font-weight: bold;
  border-left: 6px solid #e30613;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.provincia:hover {
  background: #fafafa;
}

footer {
  text-align: center;
  padding: 25px 15px 40px;
  color: #777;
  font-size: 13px;
}
</style>

</head>

<body>

<header>

<div class="ugt">UGT</div>

<h1>EL CORTE INGLÉS</h1>

<p>Andalucía Occidental · Extremadura</p>

</header>

<main>

<div class="intro">

<h2>Estamos más cerca de ti</h2>

<p>Selecciona tu provincia</p>

</div>

<a class="provincia" href="#">Sevilla</a>

<a class="provincia" href="#">Cádiz</a>

<a class="provincia" href="#">Córdoba</a>

<a class="provincia" href="#">Huelva</a>

<a class="provincia" href="#">Badajoz</a>

</main>

<footer>

UGT El Corte Inglés<br>
Andalucía Occidental · Extremadura

</footer>

</body>
</html>
