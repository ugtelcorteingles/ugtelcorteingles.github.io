<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prueba buzón confidencial UGT</title>
<style>
body{font-family:Arial,sans-serif;background:#f6f6f6;margin:0;padding:30px;color:#222}
main{max-width:680px;margin:auto;background:#fff;padding:28px;border-radius:14px}
h1{margin-top:0}.campo{margin:16px 0}label{font-weight:700;display:block;margin-bottom:7px}
input,select,textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccc;border-radius:7px;font:inherit}
textarea{min-height:150px}button{width:100%;padding:14px;border:0;border-radius:7px;background:#d71920;color:#fff;font-weight:700;font-size:16px;cursor:pointer}
.nota{font-size:14px;color:#555}.contacto{display:none}#resultado{margin-top:16px;padding:12px;border-radius:7px;background:#f1f1f1;display:none}
</style>
</head>
<body><main>
<h1>Prueba del buzón confidencial</h1>
<p>Prueba temporal antes de conectar el buzón definitivo.</p>
<form id="buzon" enctype="multipart/form-data">
<div class="campo"><label>Centro *</label><input name="centro" value="San Juan" required></div>
<div class="campo"><label>Departamento</label><input name="departamento" placeholder="Opcional"></div>
<div class="campo"><label>¿Quieres que UGT contacte contigo?</label>
<select name="quiereContacto" id="qc"><option value="no">No, no quiero facilitar datos de contacto</option><option value="si">Sí</option></select></div>
<div id="datos" class="contacto">
<div class="campo"><label>Nombre</label><input name="nombre"></div>
<div class="campo"><label>Teléfono o correo electrónico</label><input name="contacto"></div>
</div>
<div class="campo"><label>Información que quieres comunicar *</label><textarea name="mensaje" required>Mensaje de prueba del buzón confidencial.</textarea></div>
<div class="campo"><label>Adjuntar archivos</label><input type="file" name="archivos[]" multiple accept=".jpg,.jpeg,.png,.pdf,.doc,.docx">
<p class="nota">Máximo 3 archivos. 5 MB por archivo y 10 MB en total.</p></div>
<button type="submit">ENVIAR PRUEBA</button>
<div id="resultado"></div>
</form>
<script>
const qc=document.getElementById('qc'),datos=document.getElementById('datos'),form=document.getElementById('buzon'),res=document.getElementById('resultado');
qc.addEventListener('change',()=>datos.style.display=qc.value==='si'?'block':'none');
form.addEventListener('submit',async e=>{
 e.preventDefault();res.style.display='block';res.textContent='Enviando…';
 const fd=new FormData(form);
 try{
  const r=await fetch('https://ugteci.es/prueba-buzon-smtp.php',{method:'POST',body:fd});
  const j=await r.json();res.textContent=j.message||j.mensaje||(r.ok?'Enviado correctamente.':'No se pudo enviar.');
 }catch(e){res.textContent='No se pudo completar la prueba.';}
});
</script>
</main></body></html>
